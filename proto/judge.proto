syntax = "proto3";

package corecode.judge.v1;

option go_package = "github.com/K23K-dev/corecode/judge/gen;judgev1";

// Internal server-to-server API. The judge loads the exact private grading spec
// from the database; callers cannot select a runtime or supply grading cases.
service JudgeService {
  // Ephemeral example execution. Disconnecting or canceling the RPC stops it.
  rpc Run(RunRequest) returns (RunResult);
  // Acknowledges a durable submission. Disconnecting does not cancel the job.
  rpc Submit(SubmitRequest) returns (JobSnapshot);
  rpc GetJob(JobRequest) returns (JobSnapshot);
  // Queued work can cancel immediately; running work remains CANCELING until
  // cleanup is confirmed. Already terminal jobs return their existing outcome.
  rpc CancelJob(JobRequest) returns (JobSnapshot);
}

message RunRequest {
  string problem_id = 1;
  string problem_version = 2;
  string code = 3;
}

message SubmitRequest {
  // UUID supplied once by the caller and reused for retries of the same payload.
  // Reusing it with different immutable input returns ALREADY_EXISTS.
  string submission_id = 1;
  string problem_id = 2;
  string problem_version = 3;
  string code = 4;
  // Formerly completion intent IDs; never reuse this number.
  reserved 5;
  reserved "completion_intent_ids";
}

message JobRequest {
  string job_id = 1;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_CANCELING = 3;
  // Grading finished, including learner failures represented in RunResult.
  JOB_STATE_COMPLETED = 4;
  // Infrastructure or grading-spec failure, not a learner's failed case.
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELED = 6;
}

message JobSnapshot {
  string job_id = 1;
  string problem_id = 2;
  JobState state = 4;
  RunResult result = 8;
  optional string error = 9;
  // Monotonically increases with each transition so clients can ignore old snapshots.
  uint64 revision = 10;
  // Formerly the problem version and timestamps, which no caller used; never reuse these.
  reserved 3, 5, 6, 7;
  reserved "problem_version", "created_at", "started_at", "finished_at";
}

// Mirrors the existing UI result, independently of durable job metadata.
message RunResult {
  repeated CaseResult cases = 1;
  string stdout = 2;
  double duration_ms = 3;
  optional string error = 4;
}

message CaseResult {
  string name = 1;
  string input = 2;
  optional string expected = 3;
  optional string actual = 4;
  optional bool passed = 5;
  optional string error = 6;
}
